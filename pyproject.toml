[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "slopsweep"
version = "1.0.0"
description = "Agent that sweeps any codebase for security issues, AI slop, coding gaps and loose ends."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
slopsweep = "slopsweep.cli:main"

[tool.setuptools]
packages = ["slopsweep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
